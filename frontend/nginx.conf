server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # forward API calls to the backend container; no path after the port, so /api/... is kept as is
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # React Router: unknown paths (e.g. a refresh on /products/9) fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
