services:
  db:
    container_name: torch-db
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: torch
      POSTGRES_USER: torch
      POSTGRES_PASSWORD: torch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro # creates the test database into the same container, no need to create a new one
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U torch -d torch" ]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: .
    container_name: torch-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/torch
      DB_USER: torch
      DB_PASSWORD: torch
      SPRING_PROFILES_ACTIVE: seed
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
  frontend:
    build: ./frontend
    container_name: torch-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata: