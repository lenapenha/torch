name: CI, Build and Push Image

on:
  push:
    branches: [main, ci/github-actions]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.ai/**'
      - '.vscode/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.ai/**'
      - '.vscode/**'
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker compose smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build images and start stack
        run: docker compose up --build -d --wait

      - name: Check API health
        run: curl -fsS http://localhost:8080/actuator/health

      - name: Check seeded products through the frontend proxy
        run: curl -fsS http://localhost:3000/api/products | grep -q '"sku"'

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Build and push ${{ matrix.image }}
    needs: [backend, frontend, docker]
    #if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/github-actions') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - image: backend
            context: .
          - image: frontend
            context: ./frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to VPS
    needs: publish
    #if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/github-actions') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: compose.prod.yaml
          target: ${{ secrets.VPS_APP_PATH }}

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,DB_PASSWORD
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}
            umask 0077
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d --no-build
            docker logout ghcr.io
            docker image prune -f
