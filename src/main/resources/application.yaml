spring:
  application:
    name: torch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/torch}
    username: ${DB_USER:torch}
    password: ${DB_PASSWORD:torch}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
   endpoints:
    web:
     exposure:
      include: health