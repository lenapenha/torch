services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: torch
      POSTGRES_USER: torch
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U torch -d torch" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    image: ghcr.io/lenapenha/torch-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/torch
      DB_USER: torch
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: seed
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  frontend:
    image: ghcr.io/lenapenha/torch-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
