services:
  db:
    container_name: torch-db
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: torch
      POSTGRES_USER: torch
      POSTGRES_PASSWORD: torch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro # creates the test database into the same container, no need to create a new one
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U torch -d torch" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: